<!doctype html>
<html><head><meta charset="utf-8"/><title>The Forest — scanner universe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; color:#e7efe6;
    font-family:'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(1100px 720px at 18% -8%, #15321f 0%, rgba(21,50,31,0) 60%),
      radial-gradient(900px 680px at 88% 8%, #0e2a3a 0%, rgba(14,42,58,0) 55%),
      radial-gradient(1200px 900px at 50% 120%, #102014 0%, rgba(16,32,20,0) 60%),
      #05080a;
  }
  .stars { position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(180,230,200,.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(160,210,255,.4), transparent),
      radial-gradient(2px 2px at 40% 80%, rgba(210,240,200,.35), transparent),
      radial-gradient(1.5px 1.5px at 85% 25%, rgba(200,255,220,.4), transparent);
    background-size: 600px 600px, 700px 700px, 500px 500px, 650px 650px; }
  .wrap { position:relative; max-width:1380px; margin:0 auto; padding:46px 34px 70px; }
  header { text-align:center; margin-bottom:8px; }
  h1 { font-family:Georgia,'Times New Roman',serif; font-weight:600; font-size:46px;
        letter-spacing:1.5px; margin:0;
        background:linear-gradient(180deg,#eafff0,#9fd8b0); -webkit-background-clip:text;
        background-clip:text; color:transparent; text-shadow:0 2px 30px rgba(110,200,140,.18); }
  .sub { color:#9fb6a6; max-width:680px; margin:12px auto 0; line-height:1.6; font-size:14px; }
  .tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:22px auto 8px; }
  .tabs button { background:rgba(20,36,27,.8); color:#cfe6d4; border:1px solid #2c4636;
    padding:8px 18px; border-radius:999px; font-size:13.5px; font-weight:600; letter-spacing:.5px;
    cursor:pointer; transition:all .15s ease; }
  .tabs button:hover { border-color:#5aa86e; color:#eafff0; }
  .tabs button.active { background:linear-gradient(180deg,#2f7d36,#1b5524); border-color:#7fd6a0; color:#fff; }
  .legend { display:flex; align-items:center; gap:12px; justify-content:center;
             margin:10px auto 30px; color:#9fb6a6; font-size:12px; letter-spacing:.5px; }
  .legend .bar { width:240px; height:9px; border-radius:6px;
                  background:linear-gradient(90deg, #4a0d12 0%, #9d2120 17%, #d75725 33%, #e8a024 50%, #c9cf3d 67%, #66ae42 83%, #2c8f63 100%); box-shadow:0 0 18px rgba(120,200,150,.25); }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:30px 24px; }
  .leaf { margin:0; text-align:center; }
  .frame { position:relative; padding:6px; transition:transform .35s ease; }
  .frame::after { content:""; position:absolute; left:50%; bottom:6%; width:55%; height:14px;
    transform:translateX(-50%); background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
    filter:blur(3px); z-index:0; }
  .leaf img { width:100%; display:block; position:relative; z-index:1;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 16px color-mix(in srgb, var(--glow) 45%, transparent));
    transition:transform .35s ease; }
  .leaf:hover .frame { transform:translateY(-6px) scale(1.04); }
  .leaf:hover img { transform:rotate(0deg) !important; }
  figcaption { margin-top:4px; display:flex; align-items:baseline; justify-content:center; gap:10px; }
  .tk { font-weight:600; letter-spacing:1px; font-size:15px; color:#eaf3ea; }
  .ret { font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; }
  @media (max-width:1100px) { .grid { grid-template-columns:repeat(3,1fr); } h1 { font-size:38px; } }
  @media (max-width:680px) { .grid { grid-template-columns:repeat(2,1fr); } }
</style></head>

<script>
  const COUNTS = [10, 10, 9];
  const tabs = Array.from(document.querySelectorAll('.tabs button'));
  const grids = Array.from(document.querySelectorAll('.grid'));
  tabs.forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    tabs.forEach(t => t.classList.toggle('active', +t.dataset.i === i));
    grids.forEach(g => g.style.display = (+g.dataset.i === i) ? 'grid' : 'none');
  }));
</script>
