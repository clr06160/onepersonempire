<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPE Landing Mockups</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen">
  <header class="sticky top-0 z-10 border-b border-zinc-800 bg-zinc-900/95 backdrop-blur px-6 py-4">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-xl font-bold">OPE landing mockups</h1>
        <p class="text-sm text-zinc-400">Full browser preview — pick A, B, or C</p>
      </div>
      <div class="flex flex-wrap gap-2" id="tabs"></div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <p id="tagline" class="mb-4 text-center text-sm text-zinc-400"></p>
    <div class="overflow-hidden rounded-2xl border border-zinc-700 shadow-2xl">
      <div class="flex items-center gap-2 border-b border-zinc-800 bg-zinc-950 px-4 py-3">
        <span class="h-3 w-3 rounded-full bg-zinc-700"></span>
        <span class="h-3 w-3 rounded-full bg-zinc-700"></span>
        <span class="h-3 w-3 rounded-full bg-zinc-700"></span>
        <span class="flex-1 text-center text-xs text-zinc-500">onepersonempire.com</span>
      </div>
      <div id="mockup"></div>
    </div>
    <section class="mt-12 rounded-2xl border border-zinc-800 bg-zinc-950 p-6">
      <h2 class="text-lg font-bold">Recommendation</h2>
      <p class="mt-3 text-zinc-300 leading-relaxed">
        Homepage: <strong class="text-white">A (Field Phone)</strong>.
        Steal B's SMS thread as a section below the hero.
        Use <strong class="text-white">C</strong> on /painters for your friend pilot.
      </p>
    </section>
  </main>

  <script>
    const designs = [
      {
        id: 'a',
        label: 'A · Field Phone',
        tagline: 'Broad contractor ops — recommended homepage',
        html: `
        <div class="min-h-[560px] bg-zinc-950 px-8 py-12 md:px-14 md:py-16">
          <div class="mb-6 inline-block rounded-full border border-zinc-700 px-4 py-2 text-xs font-semibold uppercase tracking-widest text-emerald-400">For contractors & local trades</div>
          <h1 class="max-w-2xl text-4xl md:text-5xl font-bold leading-tight">Run your business from <span class="text-emerald-400">your phone</span></h1>
          <p class="mt-4 max-w-xl text-lg text-zinc-400">Pro link, draft quotes, invoices — we set it up. Update your site by text. Real support when you need it.</p>
          <div class="mt-8 flex flex-wrap gap-4">
            <button type="button" class="rounded-xl bg-white px-8 py-4 font-semibold text-black">Start free pilot</button>
            <button type="button" class="rounded-xl border border-zinc-600 px-8 py-4 font-semibold">Watch 60s demo</button>
          </div>
          <div class="mt-12 grid gap-4 md:grid-cols-3">
            <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6"><div class="text-lg font-semibold">Legit link</div><p class="mt-2 text-sm text-zinc-400">Look professional when customers or Google check you.</p></div>
            <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6"><div class="text-lg font-semibold">Draft quotes</div><p class="mt-2 text-sm text-zinc-400">Plans or job notes → line-item bid you edit and send.</p></div>
            <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6"><div class="text-lg font-semibold">Text to update</div><p class="mt-2 text-sm text-zinc-400">Change hours or prices from the job — no dashboard.</p></div>
          </div>
          <p class="mt-10 rounded-xl border border-dashed border-zinc-700 px-4 py-3 text-sm text-zinc-500">Not another website builder — contractor ops for people who will never open Wix.</p>
        </div>`,
      },
      {
        id: 'b',
        label: 'B · No Dashboard',
        tagline: 'Anti-Wix — workflow + SMS visual',
        html: `
        <div class="flex min-h-[560px] flex-col md:flex-row bg-zinc-100 text-zinc-900">
          <div class="flex-1 px-8 py-12 md:px-12">
            <p class="text-xs font-bold tracking-widest text-zinc-500">ONEPERSON EMPIRE</p>
            <h1 class="mt-4 max-w-md text-4xl font-bold">Contractors don't need another dashboard.</h1>
            <ol class="mt-8 space-y-5 text-base list-none p-0">
              <li class="flex gap-4"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-sm font-bold text-white">1</span>Describe your trade — we build your link</li>
              <li class="flex gap-4"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-sm font-bold text-white">2</span>Text us to change anything on site</li>
              <li class="flex gap-4"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-sm font-bold text-white">3</span>Send invoices from your phone</li>
              <li class="flex gap-4"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-sm font-bold text-white">4</span>Someone actually answers (Care plan)</li>
            </ol>
            <button type="button" class="mt-10 rounded-xl bg-zinc-900 px-8 py-4 font-semibold text-white">Book free setup call</button>
          </div>
          <div class="flex w-full md:w-80 items-center bg-zinc-950 p-6 text-white">
            <div class="w-full space-y-3 text-sm">
              <p class="text-xs text-zinc-500">Messages · Care line</p>
              <div class="ml-auto max-w-[85%] rounded-2xl rounded-br-sm bg-emerald-600 px-4 py-3">Change Saturday hours to 8–2</div>
              <div class="max-w-[85%] rounded-2xl rounded-bl-sm bg-zinc-800 px-4 py-3">Done — live on your site now.</div>
              <div class="ml-auto max-w-[85%] rounded-2xl rounded-br-sm bg-emerald-600 px-4 py-3">Invoice Mike $850 gutter job</div>
              <div class="max-w-[85%] rounded-2xl rounded-bl-sm bg-zinc-800 px-4 py-3">Pay link ready — tap to send.</div>
            </div>
          </div>
        </div>`,
      },
      {
        id: 'c',
        label: 'C · Estimate First',
        tagline: 'Painter pilot / Plan B lead',
        html: `
        <div class="min-h-[560px] bg-zinc-950 px-8 py-12 md:px-14">
          <div class="flex flex-col gap-10 lg:flex-row lg:justify-between">
            <div class="max-w-lg">
              <span class="inline-block rounded-full border border-emerald-800 bg-emerald-950 px-4 py-1.5 text-xs font-semibold text-emerald-300">Painters & plan-based trades</span>
              <h1 class="mt-5 text-4xl md:text-5xl font-bold">Stop spending nights on takeoffs.</h1>
              <p class="mt-4 text-lg text-zinc-400">Upload plans or photos → AI draft bid → you edit → text invoice. Includes your pro link.</p>
              <button type="button" class="mt-8 rounded-xl bg-emerald-600 px-8 py-4 font-semibold">Join free pilot (5 spots)</button>
            </div>
            <div class="w-full max-w-sm rounded-2xl border border-zinc-800 bg-zinc-900 p-5 text-sm">
              <p class="mb-4 text-xs text-zinc-500">Draft estimate · review before send</p>
              <table class="w-full"><tbody>
                <tr class="border-b border-zinc-800"><td class="py-3">Interior walls</td><td class="text-zinc-500">2,840 SF</td><td class="text-right font-semibold">$4,260</td></tr>
                <tr class="border-b border-zinc-800"><td class="py-3">Ceilings</td><td class="text-zinc-500">980 SF</td><td class="text-right font-semibold">$1,470</td></tr>
                <tr class="border-b border-zinc-800"><td class="py-3">Prep & prime</td><td class="text-zinc-500">1 lot</td><td class="text-right font-semibold">$890</td></tr>
                <tr><td class="py-3">Total (edit me)</td><td></td><td class="text-right font-semibold">$6,620</td></tr>
              </tbody></table>
            </div>
          </div>
          <p class="mt-12 text-sm text-zinc-600">Draft only — verify on walkthrough.</p>
        </div>`,
      },
    ];

    let selected = 'a';
    const tabs = document.getElementById('tabs');
    const mockup = document.getElementById('mockup');
    const tagline = document.getElementById('tagline');

    function render() {
      const d = designs.find((x) => x.id === selected);
      tagline.textContent = d.tagline;
      mockup.innerHTML = d.html;
      tabs.innerHTML = designs
        .map(
          (item) => `
        <button type="button" data-id="${item.id}" class="rounded-xl px-4 py-2 text-sm font-semibold ${
          selected === item.id
            ? 'bg-emerald-600 text-white'
            : 'border border-zinc-700 bg-zinc-800 text-zinc-300'
        }">${item.label}</button>`,
        )
        .join('');
      tabs.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          selected = btn.getAttribute('data-id');
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
