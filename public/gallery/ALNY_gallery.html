<!doctype html>
<html><head><meta charset="utf-8"/><title>ALNY — price as art</title>
<style>
  body { margin:0; background:#070710; color:#e8e8f0; font-family:Segoe UI,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:32px; }
  h1 { margin:0 0 4px; font-weight:700; letter-spacing:.5px; }
  .blurb { color:#aab; font-style:italic; margin-bottom:24px; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .card { margin:0; background:#0e0e1a; border:1px solid #20202e; border-radius:14px; padding:12px; }
  .card img { width:100%; border-radius:10px; display:block; }
  figcaption { color:#bcbccd; font-size:13px; margin-top:10px; line-height:1.45; }
  figcaption b { color:#f4a24b; text-transform:uppercase; letter-spacing:1px; font-size:12px; }
  figcaption .win { color:#6a6a82; font-size:11px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
</style></head>
<body><div class="wrap">
  <h1>ALNY · price as art</h1>
  <div class="blurb">ALNY: feral temperament, a steady builder, battle-worn. 5.0y of life · 84% total · 13%/yr · 47% vol · worst fall -43%.</div>
  <div class="grid">
    <figure class="card">
      <img src="ALNY_bloom.webp" alt="bloom" />
      <figcaption><b>bloom</b> <span class="win">last 6y</span><br/>Seasonal bloom — each year a petal-loop, growing outward as it climbs.</figcaption>
    </figure>
    <figure class="card">
      <img src="ALNY_heartbeat.webp" alt="heartbeat" />
      <figcaption><b>heartbeat</b> <span class="win">last 1.5y</span><br/>Heartbeat — daily moves as vital signs; flatline calm vs racing pulse.</figcaption>
    </figure>
    <figure class="card">
      <img src="ALNY_rings.webp" alt="rings" />
      <figcaption><b>rings</b> <span class="win">last 10y</span><br/>Growth rings — one ring per year, thick when the year was big.</figcaption>
    </figure>
    <figure class="card">
      <img src="ALNY_mountains.webp" alt="mountains" />
      <figcaption><b>mountains</b> <span class="win">last 10y</span><br/>Dusk mountains — the life arc as terrain; crashes carve the valleys.</figcaption>
    </figure>
    <figure class="card">
      <img src="ALNY_constellation.webp" alt="constellation" />
      <figcaption><b>constellation</b> <span class="win">last 10y</span><br/>Constellation — the most dramatic days of its life as stars.</figcaption>
    </figure>
    <figure class="card">
      <img src="ALNY_spiral.webp" alt="spiral" />
      <figcaption><b>spiral</b> <span class="win">last 10y</span><br/>Record of time — grooves wind outward, weighted by volume, hued by momentum.</figcaption>
    </figure>
    <figure class="card">
      <img src="ALNY_leaf.webp" alt="leaf" />
      <figcaption><b>leaf</b> <span class="win">last 6y</span><br/>Leaf — the price walks the margin (oldest at base-left → midpoint at tip → now at base-right); lobes & notches are that side's highs & lows. Color = health (green thriving → red dying); fast growth grows it thin & toothed, slow growth broad & waxy.</figcaption>
    </figure>
  </div>
</div></body></html>
